<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin — Atlântica Natural</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f2f5f2;margin:0;padding:20px;color:#182018}.wrap{max-width:900px;margin:auto}.box{background:#fff;padding:20px;border-radius:14px;margin:0 0 18px}input,button{font:inherit;padding:11px;border-radius:9px}input{border:1px solid #ccc;width:100%}button{border:0;background:#182018;color:#fff;cursor:pointer}.linha{display:flex;gap:10px}.linha>*{flex:1}.produto{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.produto img,.sem{width:70px;height:70px;object-fit:cover;border-radius:8px;background:#eee}.sec{background:#e7ece7;color:#182018}.erro{color:#a00}.ok{color:#176b32}@media(max-width:600px){.produto{grid-template-columns:55px 1fr}.produto img,.sem{width:55px;height:55px}.produto button{grid-column:2}.linha{flex-direction:column}}</style>
</head><body><main class="wrap">
<div class="box" id="login"><h1>Admin — Atlântica Natural</h1><p>Área para importar produtos e cadastrar preços.</p><form id="fl"><input id="senha" type="password" placeholder="Senha de administrador" required><br><br><button>Entrar</button></form><p id="erro" class="erro"></p></div>
<div id="painel" hidden><div class="box"><div class="linha"><button id="importar">Importar produtos da Atlântica Natural</button><button class="sec" id="sair">Sair</button></div><p id="status"></p></div>
<div class="box"><input id="busca" placeholder="Buscar produto pelo nome..."></div><div class="box" id="lista"></div></div>
</main>
<script>
const $=id=>document.getElementById(id);let senha=sessionStorage.getItem('atl-admin')||'',produtos=[];
const H=()=>({'Content-Type':'application/json','x-admin-password':senha});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function carregar(){
  const r=await fetch('/api/atlantica-products?auth=1',{headers:H()});
  if(!r.ok){
    let d={};try{d=await r.json()}catch{}
    sessionStorage.removeItem('atl-admin');$('login').hidden=false;$('painel').hidden=true;
    $('erro').textContent=d.erro||('Erro HTTP '+r.status);
    return false
  }
  produtos=await r.json();$('login').hidden=true;$('painel').hidden=false;render();return true
}
function render(){const q=$('busca').value.toLowerCase();const xs=produtos.filter(p=>p.nome.toLowerCase().includes(q));$('lista').innerHTML=xs.length?xs.map(p=>'<div class="produto">'+(p.imagem?'<img src="'+esc(p.imagem)+'">':'<div class="sem"></div>')+'<div><b>'+esc(p.nome)+'</b><br><small>'+esc(p.categoria||'Sem categoria')+'</small><br><label>Preço: R$ <input data-price="'+p.id+'" type="number" step="0.01" min="0" value="'+(p.preco??'')+'" placeholder="definir"></label></div><button data-save="'+p.id+'">Salvar preço</button></div>').join(''):'<p>Nenhum produto.</p>'}
$('fl').addEventListener('submit',async e=>{e.preventDefault();senha=$('senha').value;sessionStorage.setItem('atl-admin',senha);await carregar()});
$('sair').addEventListener('click',()=>{sessionStorage.removeItem('atl-admin');location.reload()});
$('busca').addEventListener('input',render);
$('lista').addEventListener('click',async e=>{const b=e.target.closest('[data-save]');if(!b)return;const p=produtos.find(x=>x.id==b.dataset.save);const price=$('[data-price="'+p.id+'"]').value;const r=await fetch('/api/atlantica-products',{method:'POST',headers:H(),body:JSON.stringify({...p,preco:price})});$('status').textContent=r.ok?'Preço salvo.':'Erro ao salvar preço.';if(r.ok)carregar()});
$('importar').addEventListener('click',async()=>{const b=$('importar');b.disabled=true;$('status').textContent='Importando produtos...';try{const r=await fetch('/api/import-atlantica',{method:'POST',headers:H(),body:'{}'});const d=await r.json();$('status').textContent=r.ok?'Importação concluída: '+d.importados+' produtos processados; '+d.encontrados+' links encontrados. Preços não foram importados.':(d.erro||'Erro na importação');await carregar()}finally{b.disabled=false}});
if(senha)carregar();
</script></body></html>
