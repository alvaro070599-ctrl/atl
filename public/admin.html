<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin | Atlântica Natural</title>
<style>
:root{--green:#173f2a;--green2:#24623f;--bg:#f3f6f2;--card:#fff;--text:#18231c;--muted:#6b756d;--line:#dfe7df;--red:#a51d2d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.top{background:var(--green);color:#fff}.topbar{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:1.15rem;font-weight:850}.back{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.3);padding:9px 13px;border-radius:10px}.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 5px 20px rgba(23,63,42,.04)}h1{margin:0;font-size:1.65rem}.sub{color:var(--muted);margin:6px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button,input,textarea{font:inherit}button{border:0;border-radius:11px;padding:11px 15px;background:var(--green);color:#fff;font-weight:750;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e8eee8;color:var(--green)}.danger{background:var(--red)}input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;outline:none}input:focus,textarea:focus{border-color:#87a88f;box-shadow:0 0 0 3px #e7f0e8}textarea{min-height:130px;resize:vertical}.search{margin-top:15px;font-size:1rem}.status{margin:12px 0 0;font-size:.92rem}.ok{color:#1d713d}.error{color:#a51d2d}.product{display:grid;grid-template-columns:92px 1fr auto;gap:15px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.product:last-child{border-bottom:0}.thumb{width:92px;height:92px;border-radius:13px;object-fit:contain;background:#f1f4f1}.thumb-empty{display:grid;place-items:center;color:#8b948d}.meta h3{margin:0 0 5px;font-size:1rem}.meta p{margin:0;color:var(--muted);font-size:.88rem}.tag{display:inline-block;background:#edf4ed;color:var(--green2);font-size:.72rem;font-weight:800;padding:4px 8px;border-radius:999px;margin-bottom:6px}.edit{background:#eef3ee;color:var(--green)}.modal{position:fixed;inset:0;background:rgba(12,25,16,.55);display:grid;place-items:center;padding:18px;z-index:50}.modal[hidden]{display:none}.dialog{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:22px}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.close{background:#eef2ee;color:var(--green);padding:8px 12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}.preview{margin-top:8px;width:120px;height:120px;object-fit:contain;background:#f2f4f2;border-radius:12px}.hint{font-size:.78rem;color:var(--muted)}.login{max-width:450px;margin:12vh auto}.login h1{margin-bottom:7px}.login form{margin-top:18px}.login button{width:100%;margin-top:10px}.count{color:var(--muted);font-size:.9rem;margin:0}.top-title{display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap}@media(max-width:700px){.wrap{padding:15px}.product{grid-template-columns:64px 1fr}.thumb{width:64px;height:64px}.product .edit{grid-column:1/-1;width:100%}.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<header class="top"><div class="wrap topbar"><div class="brand">Atlântica Natural · Administração</div><a class="back" href="/">← Ver catálogo</a></div></header>
<main class="wrap">
<section id="login" class="box login"><h1>Acesso administrativo</h1><p class="sub">Gerencie produtos sem precisar mexer no código.</p><form id="fl"><input id="senha" type="password" placeholder="Senha de administrador" required><button>Entrar</button></form><p id="erro" class="error"></p></section>
<section id="painel" hidden>
<div class="box"><div class="top-title"><div><h1>Produtos</h1><p class="sub">Edite nome, categoria, preço, descrição e imagem em poucos cliques.</p></div><p id="count" class="count"></p></div><div class="actions"><button id="importar">↻ Importar novos produtos</button><button class="secondary" id="sair">Sair</button><button class="danger" id="limpar">Excluir todos</button></div><p id="status" class="status"></p><input id="busca" class="search" placeholder="🔎 Buscar por nome ou categoria..."></div>
<div class="box" id="lista"></div>
</section></main>
<div class="modal" id="modal" hidden><div class="dialog"><div class="dialog-head"><div><h1>Editar produto</h1><p class="sub">Altere somente o que quiser e clique em salvar.</p></div><button class="close" id="fechar">Fechar</button></div><form id="editForm"><div class="fields"><label class="field full">Nome<input id="fNome" required></label><label class="field">Categoria<input id="fCat" placeholder="Ex.: Vitaminas"></label><label class="field">Preço (R$)<input id="fPreco" inputmode="decimal" placeholder="0,00"></label><label class="field full">Imagem (URL)<input id="fImg" placeholder="https://..."><span class="hint">Cole o endereço da imagem. A prévia aparece abaixo.</span><img id="preview" class="preview" hidden></label><label class="field full">Descrição<textarea id="fDesc" placeholder="Descrição do produto"></textarea></label></div><div class="actions"><button type="submit">Salvar alterações</button><button type="button" class="secondary" id="cancelar">Cancelar</button></div></form></div></div>
<script>
const $=id=>document.getElementById(id);let senha=sessionStorage.getItem('atl-admin')||'',produtos=[],editId=null;
const H=()=>({'Content-Type':'application/json','x-admin-password':senha}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function carregar(){const r=await fetch('/api/atlantica-products');if(!r.ok){$('erro').textContent='Não foi possível carregar os produtos.';return false}produtos=await r.json();$('login').hidden=true;$('painel').hidden=false;render();return true}
function render(){const q=$('busca').value.toLowerCase().trim();const xs=produtos.filter(p=>((p.nome||'')+' '+(p.categoria||'')).toLowerCase().includes(q));$('count').textContent=xs.length+' produto'+(xs.length===1?'':'s');$('lista').innerHTML=xs.length?xs.map(p=>'<div class="product"><div class="thumb">'+(p.imagem?'<img class="thumb" src="'+esc(p.imagem)+'" onerror="this.style.display=\'none\'">':'<div class="thumb thumb-empty">—</div>')+'</div><div class="meta"><span class="tag">'+esc(p.categoria||'Sem categoria')+'</span><h3>'+esc(p.nome)+'</h3><p>'+(p.preco==null?'Preço não definido':Number(p.preco).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}))+'</p></div><button class="edit" data-edit="'+esc(p.id)+'">✎ Editar</button></div>').join(''):'<p class="sub">Nenhum produto encontrado.</p>'}
function abrir(p){editId=p.id;$('fNome').value=p.nome||'';$('fCat').value=p.categoria||'';$('fPreco').value=p.preco??'';$('fImg').value=p.imagem||'';$('fDesc').value=p.descricao||'';preview();$('modal').hidden=false}
function fechar(){$('modal').hidden=true;editId=null}
function preview(){const u=$('fImg').value.trim();if(u){$('preview').src=u;$('preview').hidden=false}else $('preview').hidden=true}
$('fl').addEventListener('submit',async e=>{e.preventDefault();senha=$('senha').value;sessionStorage.setItem('atl-admin',senha);if(!(await carregar())){sessionStorage.removeItem('atl-admin');senha=''}});
$('sair').addEventListener('click',()=>{sessionStorage.removeItem('atl-admin');location.reload()});$('busca').addEventListener('input',render);$('lista').addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(b){const p=produtos.find(x=>String(x.id)===String(b.dataset.edit));if(p)abrir(p)}});
$('fImg').addEventListener('input',preview);$('fechar').addEventListener('click',fechar);$('cancelar').addEventListener('click',fechar);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))fechar()});
$('editForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='Salvando...';try{const payload={nome:$('fNome').value,categoria:$('fCat').value,preco:$('fPreco').value,imagem:$('fImg').value,descricao:$('fDesc').value};const r=await fetch('/api/atlantica-products?id='+encodeURIComponent(editId),{method:'PATCH',headers:H(),body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw new Error(d.erro||'Erro ao salvar');fechar();$('status').textContent='✓ Produto atualizado com sucesso.';$('status').className='status ok';await carregar()}catch(err){$('status').textContent=err.message;$('status').className='status error'}finally{b.disabled=false;b.textContent='Salvar alterações'}});
$('limpar').addEventListener('click',async()=>{if(!produtos.length)return alert('Não há produtos para excluir.');if(!confirm('Excluir TODOS os produtos?'))return;if(!confirm('Confirma? Esta ação não pode ser desfeita.'))return;const b=$('limpar');b.disabled=true;b.textContent='Excluindo...';try{const r=await fetch('/api/atlantica-products',{method:'DELETE',headers:H()}),d=await r.json();if(!r.ok)throw new Error(d.erro||'Erro');$('status').textContent='✓ Todos os produtos foram excluídos.';$('status').className='status ok';await carregar()}catch(err){$('status').textContent=err.message;$('status').className='status error'}finally{b.disabled=false;b.textContent='Excluir todos'}});
$('importar').addEventListener('click',async()=>{const b=$('importar');b.disabled=true;b.textContent='Importando...';$('status').textContent='Importando novos produtos...';try{const r=await fetch('/api/import-atlantica',{method:'POST',headers:H(),body:'{}'}),raw=await r.text();let d;try{d=JSON.parse(raw)}catch{d={erro:raw.slice(0,500)}}$('status').textContent=r.ok?'✓ '+d.importados+' produtos importados; '+d.restantes+' restantes.':('Erro '+r.status+': '+(d.erro||'falha'));$('status').className='status '+(r.ok?'ok':'error');await carregar()}catch(e){$('status').textContent='Erro de comunicação: '+e.message;$('status').className='status error'}finally{b.disabled=false;b.textContent='↻ Importar novos produtos'}});if(senha)carregar();
</script></body></html>
