<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin — Atlântica Natural</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f2f5f2;margin:0;padding:20px;color:#182018}.wrap{max-width:1100px;margin:auto}.box{background:#fff;padding:20px;border-radius:14px;margin:0 0 18px}input,textarea,button{font:inherit;padding:11px;border-radius:9px}input,textarea{border:1px solid #ccc;width:100%}textarea{min-height:110px;resize:vertical}button{border:0;background:#182018;color:#fff;cursor:pointer}.linha{display:flex;gap:10px}.linha>*{flex:1}.sec{background:#e7ece7;color:#182018}.perigo{background:#a71919}.erro{color:#a00}.ok{color:#176b32}.produto{border:1px solid #e1e6e1;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:100px 1fr;gap:14px}.produto img,.sem{width:100px;height:100px;object-fit:cover;border-radius:8px;background:#eee}.campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.campo{display:flex;flex-direction:column;gap:5px}.campo.full{grid-column:1/-1}.acoes{display:flex;gap:8px;margin-top:10px}.acoes button{flex:1}.preview{margin-top:6px;color:#666;font-size:12px;word-break:break-all}@media(max-width:700px){.linha,.acoes{flex-direction:column}.grid{grid-template-columns:1fr}.produto img,.sem{width:100%;height:180px}.campos{grid-template-columns:1fr}.campo.full{grid-column:auto}}</style></head>
<body><main class="wrap">
<div class="box" id="login"><h1>Admin — Atlântica Natural</h1><p>Gerencie produtos, preços, descrições e imagens.</p><form id="fl"><input id="senha" type="password" placeholder="Senha de administrador" required><br><br><button>Entrar</button></form><p id="erro" class="erro"></p></div>
<div id="painel" hidden><div class="box"><div class="linha"><button id="importar">Importar produtos da Atlântica Natural</button><button class="perigo" id="limpar">Excluir todos os produtos</button><button class="sec" id="sair">Sair</button></div><p id="status"></p></div><div class="box"><input id="busca" placeholder="Buscar produto pelo nome..."></div><div class="box" id="lista"></div></div>
</main><script>
const $=id=>document.getElementById(id);let senha=sessionStorage.getItem('atl-admin')||'',produtos=[];
const H=()=>({'Content-Type':'application/json','x-admin-password':senha});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function carregar(){const r=await fetch('/api/atlantica-products');if(!r.ok){$('erro').textContent='Não foi possível carregar os produtos.';return false}produtos=await r.json();$('login').hidden=true;$('painel').hidden=false;render();return true}
function render(){const q=$('busca').value.toLowerCase();const xs=produtos.filter(p=>(p.nome||'').toLowerCase().includes(q));$('lista').innerHTML=xs.length?xs.map(p=>'<div class="produto" data-id="'+esc(p.id)+'"><div class="grid">'+(p.imagem?'<img src="'+esc(p.imagem)+'" onerror="this.style.display=\'none\'">':'<div class="sem"></div>')+'<div class="campos"><label class="campo full">Nome<input data-f="nome" value="'+esc(p.nome)+'"></label><label class="campo">Categoria<input data-f="categoria" value="'+esc(p.categoria||'')+'"></label><label class="campo">Preço (R$)<input data-f="preco" type="text" inputmode="decimal" value="'+(p.preco??'')+'" placeholder="0,00"></label><label class="campo full">Imagem (URL)<input data-f="imagem" value="'+esc(p.imagem||'')+'"></label><div class="campo full"><small>Imagem atual</small><div class="preview">'+esc(p.imagem||'Sem imagem')+'</div></div><label class="campo full">Descrição<textarea data-f="descricao">'+esc(p.descricao||'')+'</textarea></label></div></div><div class="acoes"><button data-save="'+esc(p.id)+'">Salvar alterações</button><button class="perigo" data-delete="'+esc(p.id)+'">Excluir produto</button></div></div>').join(''):'<p>Nenhum produto.</p>'}
$('fl').addEventListener('submit',async e=>{e.preventDefault();senha=$('senha').value;sessionStorage.setItem('atl-admin',senha);if(!(await carregar())){sessionStorage.removeItem('atl-admin');senha=''}});
$('sair').addEventListener('click',()=>{sessionStorage.removeItem('atl-admin');location.reload()});$('busca').addEventListener('input',render);
$('lista').addEventListener('click',async e=>{const save=e.target.closest('[data-save]');if(save){const box=save.closest('.produto'),payload={};box.querySelectorAll('[data-f]').forEach(x=>payload[x.dataset.f]=x.value);save.disabled=true;save.textContent='Salvando...';try{const r=await fetch('/api/atlantica-products?id='+encodeURIComponent(save.dataset.save),{method:'PATCH',headers:H(),body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw new Error(d.erro||'Erro ao salvar');$('status').textContent='Alterações salvas com sucesso.';$('status').className='ok';await carregar()}catch(err){$('status').textContent=err.message;$('status').className='erro'}finally{save.disabled=false;save.textContent='Salvar alterações'}return}const del=e.target.closest('[data-delete]');if(del){if(!confirm('Excluir este produto?'))return;del.disabled=true;try{const r=await fetch('/api/atlantica-products?id='+encodeURIComponent(del.dataset.delete),{method:'DELETE',headers:H()}),d=await r.json();if(!r.ok)throw new Error(d.erro||'Erro ao excluir');$('status').textContent='Produto excluído.';$('status').className='ok';await carregar()}catch(err){$('status').textContent=err.message;$('status').className='erro'}finally{del.disabled=false}}});
$('limpar').addEventListener('click',async()=>{if(!produtos.length)return alert('Não há produtos para excluir.');if(!confirm('ATENÇÃO: isto excluirá TODOS os produtos importados do catálogo. Continuar?'))return;if(!confirm('Confirma novamente? Esta ação não pode ser desfeita.'))return;const b=$('limpar');b.disabled=true;b.textContent='Excluindo...';try{const r=await fetch('/api/atlantica-products',{method:'DELETE',headers:H()}),d=await r.json();if(!r.ok)throw new Error(d.erro||'Erro ao excluir');$('status').textContent='Todos os produtos foram excluídos.';$('status').className='ok';await carregar()}catch(err){$('status').textContent=err.message;$('status').className='erro'}finally{b.disabled=false;b.textContent='Excluir todos os produtos'}});
$('importar').addEventListener('click',async()=>{const b=$('importar');b.disabled=true;$('status').textContent='Importando produtos...';try{const r=await fetch('/api/import-atlantica',{method:'POST',headers:H(),body:'{}'}),d=await r.json();$('status').textContent=r.ok?'Importação concluída: '+d.importados+' produtos processados; '+d.encontrados+' links encontrados; '+d.falhas+' falhas.':'Erro: '+(d.erro||'falha na importação');$('status').className=r.ok?'ok':'erro';await carregar()}catch(e){$('status').textContent='Erro de comunicação: '+e.message;$('status').className='erro'}finally{b.disabled=false}});if(senha)carregar();
</script></body></html>
