<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlântica Natural | Catálogo</title><meta name="description" content="Catálogo de produtos Atlântica Natural">
<style>
:root{--black:#0b0b0b;--black2:#151515;--gold:#d4af5a;--gold2:#a77b25;--white:#fff;--cream:#f6f3ec;--text:#171717;--muted:#73716c;--line:#e4ded1}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1240px;margin:auto;padding:0 24px}
.top{position:sticky;top:0;z-index:30;background:rgba(11,11,11,.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(212,175,90,.25)}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;color:#fff;font-weight:850;letter-spacing:.01em}.mark{width:42px;height:42px;border:1px solid var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold);font-size:1.15rem;font-weight:950;background:linear-gradient(145deg,#171717,#050505);box-shadow:0 0 22px rgba(212,175,90,.12)}
.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 80% 20%,rgba(212,175,90,.20),transparent 28%),radial-gradient(circle at 10% 100%,rgba(212,175,90,.10),transparent 30%),linear-gradient(135deg,#080808,#191919 58%,#0b0b0b);color:#fff;padding:88px 0 78px;border-bottom:1px solid rgba(212,175,90,.35)}.hero:after{content:"";position:absolute;width:420px;height:420px;border:1px solid rgba(212,175,90,.14);border-radius:50%;right:-180px;bottom:-240px;box-shadow:0 0 0 35px rgba(212,175,90,.035),0 0 0 70px rgba(212,175,90,.025)}.hero-inner{position:relative;z-index:1}.eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--gold);font-size:.78rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-bottom:18px}.eyebrow:before{content:"";width:28px;height:1px;background:var(--gold)}.hero h1{font-size:clamp(2.8rem,7vw,6.2rem);line-height:.92;letter-spacing:-.065em;max-width:820px;margin:0 0 22px}.hero h1 span{color:var(--gold)}.hero p{font-size:1.08rem;line-height:1.7;color:#c8c5bd;max-width:650px;margin:0}
.catalog{padding-top:34px}.toolbar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}.search-wrap{position:relative;flex:1;max-width:480px}.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#9a927f}.search{width:100%;border:1px solid var(--line);background:#fff;padding:14px 16px 14px 43px;border-radius:14px;outline:none;font-size:.96rem}.search:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,90,.14)}.count{color:var(--muted);font-size:.88rem;margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.filters button{border:1px solid #d9d2c5;background:#fff;color:#333;padding:9px 15px;border-radius:999px;cursor:pointer;font-weight:700;transition:.18s}.filters button:hover{border-color:var(--gold);transform:translateY(-1px)}.filters button.active{background:var(--black);color:#fff;border-color:var(--black);box-shadow:0 5px 16px rgba(0,0,0,.14)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:20px;padding-bottom:70px}.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.22s;box-shadow:0 8px 24px rgba(20,18,12,.045)}.card:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold2),var(--gold),transparent)}.card:hover{transform:translateY(-5px);box-shadow:0 18px 38px rgba(20,18,12,.11);border-color:#d8c9aa}.photo{aspect-ratio:1/1;background:linear-gradient(145deg,#f8f6f0,#eeece5);overflow:hidden;padding:14px}.photo img{width:100%;height:100%;object-fit:contain;display:block;mix-blend-mode:multiply}.empty{height:100%;display:grid;place-items:center;color:#aaa396;font-size:.9rem}.info{padding:18px 18px 19px}.cat{font-size:.7rem;font-weight:900;letter-spacing:.12em;color:var(--gold2);margin-bottom:8px}.info h2{font-size:1.06rem;line-height:1.25;margin:0 0 9px}.desc{color:var(--muted);font-size:.88rem;line-height:1.55;min-height:43px;margin:0}.price{margin-top:15px;font-size:1.13rem;font-weight:900;color:var(--black)}.no-price{color:#8b877e;font-size:.9rem;font-weight:700}.empty-state{grid-column:1/-1;text-align:center;padding:65px;color:var(--muted);background:#fff;border:1px dashed #d8d1c3;border-radius:18px}
footer{background:var(--black);color:#a9a59c;padding:30px 0;border-top:1px solid rgba(212,175,90,.28);font-size:.88rem}footer strong{color:var(--gold)}
@media(max-width:600px){.wrap{padding:0 15px}.nav{height:66px}.brand{font-size:1rem}.mark{width:38px;height:38px}.hero{padding:62px 0 55px}.hero h1{font-size:clamp(2.65rem,14vw,4rem)}.hero p{font-size:1rem}.catalog{padding-top:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.info{padding:12px}.info h2{font-size:.94rem}.desc{font-size:.78rem;min-height:0}.price{font-size:.98rem}.photo{padding:9px}.count{width:100%}}
</style></head><body>
<header class="top"><div class="wrap nav"><div class="brand"><span class="mark">A</span><span>Atlântica Natural</span></div></div></header>
<section class="hero"><div class="wrap hero-inner"><div class="eyebrow">Catálogo oficial</div><h1>Naturalmente <span>melhor.</span></h1><p>Encontre produtos Atlântica Natural para cuidar da sua rotina com qualidade, praticidade e escolhas mais naturais.</p></div></section>
<main class="wrap catalog"><div class="toolbar"><div class="search-wrap"><span class="search-icon">⌕</span><input id="busca" class="search" placeholder="Buscar produto..." autocomplete="off"></div><p id="count" class="count"></p></div><div id="filtros" class="filters"></div><section id="grade" class="grid"><div class="empty-state">Carregando produtos...</div></section></main>
<footer><div class="wrap"><strong>Atlântica Natural</strong> · Catálogo de produtos</div></footer>
<script>
let produtos=[],filtro='Todos',busca='';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const upper=s=>String(s??'').trim().toUpperCase();
const sentence=s=>{s=String(s??'').trim().toLowerCase();return s?s.charAt(0).toUpperCase()+s.slice(1):''};
function cats(){return ['Todos',...new Set(produtos.map(p=>upper(p.categoria)).filter(Boolean))].sort((a,b)=>a==='Todos'?-1:b==='Todos'?1:a.localeCompare(b,'pt-BR'))}
function render(){const list=produtos.filter(p=>(filtro==='Todos'||upper(p.categoria)===filtro)&&((upper(p.nome)+' '+sentence(p.descricao)).toLowerCase()).includes(busca.toLowerCase()));$('filtros').innerHTML=cats().map(c=>'<button class="'+(c===filtro?'active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('');$('count').textContent=list.length+' produto'+(list.length===1?'':'s');$('grade').innerHTML=list.length?list.map(p=>'<article class="card"><div class="photo">'+(p.imagem?'<img loading="lazy" src="'+esc(p.imagem)+'" alt="'+esc(upper(p.nome))+'" onerror="this.parentElement.innerHTML=\'<div class=empty>Imagem indisponível</div>\'">':'<div class="empty">Sem imagem</div>')+'</div><div class="info"><div class="cat">'+esc(upper(p.categoria||'Sem categoria'))+'</div><h2>'+esc(upper(p.nome))+'</h2><p class="desc">'+esc(sentence(p.descricao||''))+'</p><div class="'+(p.preco==null?'no-price':'price')+'">'+(p.preco==null?'Preço a consultar':Number(p.preco).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}))+'</div></div></article>').join(''):'<div class="empty-state">Nenhum produto encontrado.</div>'}
$('filtros').addEventListener('click',e=>{if(e.target.dataset.cat){filtro=e.target.dataset.cat;render()}});$('busca').addEventListener('input',e=>{busca=e.target.value;render()});
fetch('/api/atlantica-products').then(r=>r.json()).then(x=>{produtos=Array.isArray(x)?x:[];render()}).catch(()=>{$('grade').innerHTML='<div class="empty-state">Não foi possível carregar o catálogo.</div>'});
</script></body></html>
